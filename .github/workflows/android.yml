name: Android

on:
  push:
    paths:
      - "android/**"
      # The app ships shared/default-config.json and its tests read shared/fixtures
      - "shared/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment shows the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 25 matches the Gradle daemon requirement in android/gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Also validates the Gradle wrapper jar. "basic" is the open-source cache; the default
      # ("enhanced") is a commercial service we haven't approved
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug test lint
