name: Backend

on:
  push:
    paths:
      - "backend/**"
      # The backend validates with shared/config.schema.json, seeds shared/default-config.json and tests the fixtures
      - "shared/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # The database tests run against a real Postgres, the same version as docker-compose.yml (D-129)
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: nyx
          POSTGRES_PASSWORD: nyx
          POSTGRES_DB: nyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyx -d nyx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://nyx:nyx@localhost:5432/nyx_test
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the comment shows the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + coverage (≥ 80% on src/features)
        run: npm run test:coverage

      # Catches a Dockerfile or .dockerignore that no longer matches the code; the context is the repo root (D-42)
      - name: Docker image builds
        working-directory: .
        run: docker build -f backend/Dockerfile -t nyx-api:ci .
