# Local development: Postgres + the API (ARCHITECTURE §12). The API image also serves the built console at
# http://localhost:3000/console/; for live editing run the console separately (`npm run dev` in admin/).
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      # Dev-only credentials; production gets its own in M15
      POSTGRES_USER: nyx
      POSTGRES_PASSWORD: nyx
      POSTGRES_DB: nyx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates nyx_test for `npm test` when the volume is new (D-129)
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyx -d nyx"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Inside Compose the database is the `db` service, not localhost
      DATABASE_URL: postgres://nyx:nyx@db:5432/nyx
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
